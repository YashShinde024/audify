name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit & DSP test suite (Vitest)
        run: npm test

      - name: Verify TypeScript types
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint

      - name: Verify DSP math & audio calculations
        run: npx tsx scripts/verify-audio.ts

      - name: Build Next.js application
        run: npm run build

